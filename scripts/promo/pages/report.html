<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>周报 · 第 42 周</title>
<style>
  body { margin: 0; font: 16px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #1f2328; background: #f3f5f8; }
  main { max-width: 980px; margin: 44px auto; padding: 0 32px; }
  h1 { font-size: 30px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 26px; }
  .kpi { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .kpi small { color: #6e7781; display: block; }
  .kpi b { font-size: 30px; }
  .kpi .up { color: #1a7f37; font-size: 14px; margin-left: 6px; }
  .card { background: #fff; border-radius: 14px; padding: 20px 24px; box-shadow: 0 1px 2px rgba(0,0,0,.06); margin-bottom: 18px; }
  .card h2 { font-size: 18px; margin: 0 0 8px; }
  .bars { display: flex; align-items: flex-end; gap: 14px; height: 120px; margin-top: 10px; }
  .bars i { flex: 1; background: #5b8def; border-radius: 6px 6px 0 0; }
</style>
</head>
<body>
<main>
  <h1>周报 · 第 42 周</h1>
  <div class="grid">
    <div class="kpi"><small>活跃用户</small><b>18,240</b><span class="up">↑ 6.2%</span></div>
    <div class="kpi"><small>转化率</small><b>3.8%</b><span class="up">↑ 0.4</span></div>
    <div class="kpi"><small>平均响应</small><b>210 ms</b><span class="up">↓ 12%</span></div>
  </div>
  <div class="card">
    <h2>本周进展</h2>
    <p>结账改版完成高保真设计；支付服务完成压测；客服知识库上线新的退款说明。</p>
    <div class="bars"><i style="height:40%"></i><i style="height:55%"></i><i style="height:48%"></i><i style="height:70%"></i><i style="height:66%"></i><i style="height:84%"></i><i style="height:92%"></i></div>
  </div>
  <div class="card">
    <h2>下周计划</h2>
    <p>结账改版设计评审；灰度方案确认；整理第四季度目标。</p>
  </div>
</main>
</body>
</html>
